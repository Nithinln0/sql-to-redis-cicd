
name: SQL to Redis CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run automated tests
        run: pytest -v

      - name: Start MySQL and Redis
        run: docker compose up -d

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if docker exec sql-redis-mysql \
              mysqladmin ping -h 127.0.0.1 \
              -u root -prootpass123 --silent; then
              echo "MySQL is ready"
              break
            fi
            sleep 2
          done
          docker exec sql-redis-mysql \
            mysqladmin ping -h 127.0.0.1 \
            -u root -prootpass123 --silent

      - name: Check MySQL source data
        run: |
          docker exec sql-redis-mysql mysql -u root -prootpass123 company -e "SELECT * FROM products;"
          docker exec sql-redis-mysql mysql -u root -prootpass123 company -e "SELECT * FROM employees;"

      - name: Run SQL to Redis migration
        run: python -m app.migrate

      - name: Verify Redis employee data
        run: |
          count=$(docker exec sql-redis-redis redis-cli EXISTS employee:101 employee:102 employee:103)
          echo "Employee keys found: $count"
          test "$count" -eq 3

      - name: Verify Redis product data
        run: |
          count=$(docker exec sql-redis-redis redis-cli EXISTS product:201 product:202)
          echo "Product keys found: $count"
          test "$count" -eq 2

      - name: Display migrated products
        run: |
          docker exec sql-redis-redis redis-cli GET product:201
          docker exec sql-redis-redis redis-cli GET product:202

      - name: Generate pipeline summary
        if: always()
        run: |
          echo "## SQL to Redis Migration Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Automated Tests | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Employee Validation | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Product Validation | Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Pipeline | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

      - name: Stop databases
        if: always()
        run: docker compose down
